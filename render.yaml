services:
  - type: worker
    name: weekly-ha-supertrend-alerts-upstox
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scanner.py
    envVars:
      - key: UPSTOX_ACCESS_TOKEN
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: MAX_SYMBOLS
        value: "500"
      - key: HISTORY_WEEKS
        value: "120"
      - key: ST_PERIOD
        value: "1"
      - key: ST_FACTOR
        value: "1"
      - key: PRICE_MIN
        value: "0"
      - key: PRICE_MAX
        value: "999999"
      - key: SYMBOLS_FILE
        value: "symbols.csv"
      - key: CACHE_DIR
        value: "cache"
